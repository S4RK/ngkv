[project]
name = "ngkv"
version = "0.3.0"
description = "Necessity-Gated KV Cache Management for LLM serving"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.44"]
sim = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["ngkv", "ngkv.adapters"]
